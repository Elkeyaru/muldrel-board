<title>Expediente Muldrel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Special+Elite&family=IBM+Plex+Mono:wght@400;500;600;700&family=Caveat:wght@500;700&family=Reenie+Beanie&family=Homemade+Apple&family=Shadows+Into+Light&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0c09;
    --ink-2:#14170f;
    --ink-3:#1c2016;
    --paper:#e6dcb8;
    --paper-2:#d3c495;
    --paper-3:#efe6c8;
    --paper-ink:#211d12;
    --paper-ink-soft:#5b543d;
    --blood:#7c2020;
    --blood-bright:#a53131;
    --amber:#c98a2c;
    --ok:#4c7a4c;
    --line:#4a4a36;
    --text:#dcd4b8;
    --text-dim:#8f8b74;
    --r-card:10px;
    --r-btn:6px;
    --r-pill:999px;
    --shadow-card:0 1px 2px rgba(20,17,8,0.08), 0 10px 24px rgba(20,17,8,0.14);
    --shadow-modal:0 30px 70px rgba(0,0,0,0.55);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 1100px 900px at 50% 50%, transparent 45%, rgba(0,0,0,0.7) 100%),
      var(--ink);
    color:var(--text);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Anton',sans-serif; font-weight:400; letter-spacing:0.5px; text-wrap:balance; margin:0;}
  p{line-height:1.7; margin:0 0 12px;}
  p:last-child{margin-bottom:0;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  ::selection{background:var(--blood); color:var(--paper);}

  /* ---------- botones (base compartida) ---------- */
  .btn, .opcion, .elegible, .evidencia-btn, .hallazgo{
    border-radius:var(--r-btn);
    transition:border-color .15s ease, background .15s ease, transform .1s ease, box-shadow .15s ease;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .estampa{
    display:inline-block; font-family:'Anton',sans-serif; letter-spacing:3px;
    border:3px solid var(--blood-bright); color:var(--blood-bright);
    padding:5px 16px; border-radius:3px; transform:rotate(-4deg); text-transform:uppercase;
  }
  .estampa--ambar{border-color:var(--amber); color:var(--amber);}

  /* ---------- portada compartida ---------- */
  .portada-marca{font-family:'IBM Plex Mono'; font-size:0.72rem; letter-spacing:4px; color:var(--text-dim); text-transform:uppercase;}
  .portada-expediente{font-size:0.85rem; color:var(--amber); letter-spacing:1px;}
  .portada-resumen{max-width:580px; color:var(--text); font-size:0.95rem; font-family:'Special Elite', monospace;}
  .portada-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center; font-size:0.7rem;color:var(--text-dim);}
  .chip{border:1px solid var(--line); padding:4px 10px; border-radius:999px;}

  /* ---------- gate (portón de entrada) ---------- */
  #gate{
    position:fixed; inset:0; background:var(--ink); display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:100; flex-direction:column; gap:18px;
  }
  #gate .gota{width:16px; height:16px; margin:0 auto;}
  #gate p{font-family:'IBM Plex Mono'; letter-spacing:3px; text-transform:uppercase; font-size:0.78rem; color:var(--text-dim); animation:pulso 2s ease-in-out infinite;}
  @keyframes pulso{0%,100%{opacity:0.4} 50%{opacity:1}}

  /* ---------- gota de sangre (motivo Dexter) ---------- */
  .gota{width:22px; height:22px; background:var(--blood-bright); border-radius:50% 50% 50% 0; transform:rotate(45deg); box-shadow:0 3px 8px rgba(165,49,49,0.4);}

  /* ---------- lámina de vidrio / muestra ---------- */
  .lamina{
    position:relative; width:min(260px,70vw); aspect-ratio:5/3; background:linear-gradient(160deg, rgba(255,255,255,0.14), rgba(255,255,255,0.02) 40%), #171a13;
    border:1px solid rgba(238,241,236,0.25); border-radius:4px; transform:rotate(-3deg);
    box-shadow:0 20px 50px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(238,241,236,0.06);
    display:flex; align-items:center; justify-content:center;
  }
  .lamina::before{
    content:""; position:absolute; top:0; left:14%; width:22%; height:100%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,0.18), transparent);
    transform:skewX(-18deg);
  }
  .lamina::after{
    content:"MB-07 · MUESTRA"; position:absolute; bottom:8px; right:12px; font-family:'IBM Plex Mono';
    font-size:0.55rem; letter-spacing:1.5px; color:rgba(238,241,236,0.4);
  }
  .lamina .gota{width:34px; height:34px; filter:blur(0.2px);}

  /* ---------- menú ---------- */
  #menu{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:40px 18px; text-align:center;}
  #menu h1{font-size:clamp(2.6rem,10vw,5rem); color:var(--paper); line-height:0.92; position:relative; display:inline-block;}
  #menu h1 .goteo{position:absolute; left:52%; bottom:-16px; width:6px; height:16px; background:var(--blood-bright); border-radius:0 0 50% 50%;}
  .menu-tagline{font-family:'Special Elite'; font-size:0.85rem; color:var(--text-dim); max-width:420px;}

  /* ---------- lobby ---------- */
  #lobby{min-height:100vh; display:none; flex-direction:column; align-items:center; gap:28px; padding:48px 18px 70px; text-align:center;}
  #lobby.activo{display:flex;}
  .lobby-titulo{font-size:clamp(1.8rem,5vw,2.6rem); color:var(--paper);}
  .grid-casos{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; max-width:760px; width:100%;}
  .caso-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-card); padding:0; overflow:hidden;
    cursor:pointer; text-align:left; color:var(--text); transition:transform .15s ease, border-color .15s ease;
  }
  .caso-card:hover{transform:translateY(-3px); border-color:var(--amber);}
  .caso-card.seleccionado{border-color:var(--blood-bright); box-shadow:0 0 0 1px var(--blood-bright);}
  .caso-card__lamina{aspect-ratio:16/10; position:relative; background:linear-gradient(165deg, rgba(255,255,255,0.08), transparent 55%), var(--ink); display:flex; align-items:center; justify-content:center; border-bottom:1px solid var(--line);}
  .caso-card__num{position:absolute; top:9px; left:10px; font-family:'IBM Plex Mono'; font-size:0.6rem; color:var(--text-dim); letter-spacing:1px;}
  .caso-card__info{padding:14px 16px 16px;}
  .caso-card__info h4{font-size:1.05rem; color:var(--paper); margin-bottom:4px;}
  .caso-card__info span{font-size:0.72rem; color:var(--text-dim); display:block;}
  .caso-card--bloqueado{cursor:not-allowed; opacity:0.55;}
  .caso-card--bloqueado:hover{transform:none; border-color:var(--line);}
  .caso-card--bloqueado .caso-card__lamina{filter:grayscale(1);}
  .caso-detalle{max-width:600px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-card); padding:26px 28px; text-align:left; box-shadow:var(--shadow-card);}
  .caso-detalle h3{color:var(--paper); font-size:1.6rem; margin-bottom:4px;}
  .form-lobby{display:flex; flex-direction:column; gap:6px; margin:6px 0 16px;}
  .form-lobby label{font-family:'IBM Plex Mono'; font-size:0.7rem; color:var(--amber); letter-spacing:0.5px; margin-top:6px;}
  .input-lobby{
    padding:11px 13px; border-radius:var(--r-btn); border:1px solid var(--line); background:var(--ink);
    color:var(--text); font-family:'IBM Plex Mono'; font-size:0.9rem;
  }
  .input-lobby:focus-visible{outline:2px solid var(--amber);}
  .lobby-volver{background:none; border:none; color:var(--text-dim); font-family:'IBM Plex Mono'; font-size:0.72rem; letter-spacing:1px; text-transform:uppercase;}

  .btn-audio{
    position:fixed; bottom:18px; right:18px; z-index:150; width:38px; height:38px; border-radius:50%;
    background:var(--ink-2); border:1px solid var(--line); color:var(--text-dim); font-size:0.95rem;
    display:flex; align-items:center; justify-content:center;
  }
  .btn-audio:hover{border-color:var(--amber); color:var(--amber);}
  .btn{
    font-family:'IBM Plex Mono';font-weight:600; letter-spacing:1.5px;text-transform:uppercase;font-size:0.82rem;
    padding:13px 26px;border:1px solid var(--amber); background:transparent;color:var(--amber);
    box-shadow:0 1px 0 rgba(255,255,255,0.03) inset;
  }
  .btn:hover{background:var(--amber); color:var(--ink); transform:translateY(-1px);}
  .btn--sangre{border-color:var(--blood-bright); color:var(--blood-bright);}
  .btn--sangre:hover{background:var(--blood-bright); color:var(--paper);}
  .btn--fantasma{border-color:var(--line); color:var(--text-dim);}
  .btn--pequeno{padding:7px 14px; font-size:0.68rem; letter-spacing:1px;}
  .btn:disabled{opacity:0.35; cursor:not-allowed; background:transparent; color:var(--amber); transform:none;}
  .aviso-prototipo{max-width:540px; font-size:0.72rem; color:var(--text-dim); border-left:2px solid var(--line); padding:8px 12px; text-align:left;}

  /* ---------- shell ---------- */
  #juego{display:none; min-height:100vh; flex-direction:column;}
  #juego.activo{display:flex;}
  .topbarra{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:12px 18px; background:var(--ink-2); border-bottom:2px solid var(--line);
    position:sticky; top:0; z-index:20; flex-wrap:wrap;
  }
  .topbarra-caso{font-family:'Anton'; letter-spacing:1px; color:var(--paper); font-size:1.1rem;}
  .topbarra-caso small{display:block; font-family:'IBM Plex Mono'; font-size:0.62rem; color:var(--text-dim); letter-spacing:2px; font-weight:400;}
  .topbarra-derecha{font-size:0.72rem; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .reloj::before{content:"expediente abierto hace ";}

  .cuerpo{display:flex; flex:1; min-height:0;}
  .rail{display:flex; flex-direction:column; gap:4px; padding:18px 10px 18px 16px; background:var(--ink); flex:0 0 176px;}
  .tab{
    text-align:left; background:transparent; color:var(--text-dim); border:none; border-left:3px solid transparent;
    padding:10px 12px; font-family:'IBM Plex Mono'; font-size:0.74rem; font-weight:600;
    letter-spacing:0.5px; text-transform:uppercase; border-radius:0 6px 6px 0;
  }
  .tab:hover{background:var(--ink-3); color:var(--text);}
  .tab.activo{background:var(--paper); color:var(--paper-ink); border-left-color:var(--blood-bright);}
  .tab.activo:hover{background:var(--paper);}
  .tab .badge-tab{display:block; font-size:0.58rem; color:var(--blood-bright); margin-top:3px; letter-spacing:0.3px; text-transform:none; font-weight:500;}
  .tab.activo .badge-tab{color:var(--blood);}
  .panel{flex:1; min-width:0; background:var(--paper); color:var(--paper-ink); padding:28px 28px 80px; overflow-y:auto;}
  .panel > *{max-width:700px;}
  .panel > .grid-sospechosos, .panel > .grid-pruebas, .panel > .corcho, .panel > .corcho-intro, .panel > .corcho-ayuda{max-width:none;}

  @media (max-width:760px){
    .cuerpo{flex-direction:column;}
    .rail{flex-direction:row; flex:0 0 auto; overflow-x:auto; padding:10px 12px; gap:6px; -webkit-overflow-scrolling:touch;}
    .tab{border-left:none; border-bottom:3px solid transparent; border-radius:6px 6px 0 0; flex:0 0 auto; white-space:nowrap;}
    .tab.activo{border-bottom-color:var(--blood-bright);}
    .panel{padding:18px 16px 60px;}
  }

  /* ---------- documentos ---------- */
  .doc{
    background:#f1e9cc; border:1px solid rgba(33,29,18,0.12); border-radius:var(--r-card); padding:22px 24px; margin-bottom:18px;
    box-shadow:var(--shadow-card);
  }
  .doc h3{font-size:1.2rem; color:var(--blood); margin-bottom:12px;}
  .doc-etiqueta{
    display:inline-block; font-family:'IBM Plex Mono'; font-size:0.62rem; font-weight:700;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--paper-ink-soft);
    background:rgba(33,29,18,0.06); padding:3px 10px; border-radius:var(--r-pill); margin-bottom:12px;
  }
  .doc p{font-family:'Special Elite',monospace; font-size:0.9rem;}
  .doc-fuente{font-size:0.68rem; color:#8a836a; margin-top:10px; font-family:'IBM Plex Mono';}

  .hallazgo{
    display:block; width:100%; text-align:left; background:#e9dfbd; border:1px solid rgba(33,29,18,0.16);
    padding:13px 15px; margin-bottom:8px; color:var(--paper-ink);
    font-family:'IBM Plex Mono'; font-size:0.85rem; font-weight:600; box-shadow:0 1px 2px rgba(33,29,18,0.06);
  }
  .hallazgo:hover{border-color:var(--blood); transform:translateY(-1px); box-shadow:0 4px 10px rgba(33,29,18,0.12);}
  .hallazgo.visto{background:#f1e9cc; border-color:var(--blood);}
  .hallazgo-texto{font-family:'Special Elite',monospace; font-weight:400; font-size:0.85rem; margin-top:8px; max-height:0; overflow:hidden; transition:max-height .35s ease;}
  .hallazgo.visto .hallazgo-texto{max-height:260px;}

  .redactado{
    background:#0c0c0c; color:transparent; border-radius:var(--r-btn); padding:10px 14px; margin:7px 0;
    cursor:pointer; user-select:none; font-family:'Special Elite'; font-size:0.85rem;
  }
  .redactado::after{content:"pulsa para desclasificar"; color:#7a7a7a; font-family:'IBM Plex Mono'; font-size:0.65rem; letter-spacing:1px;}
  .redactado.visible{background:transparent; color:var(--paper-ink); cursor:default;}
  .redactado.visible::after{content:none;}

  .escena-header{position:relative; background:#0a0a08; border-radius:var(--r-card); overflow:hidden; margin-bottom:18px; min-height:150px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-card);}
  .cinta-policial{position:absolute; left:-10%; width:120%; height:22px; background:repeating-linear-gradient(45deg,#c98a2c 0 16px,#100e08 16px 32px); opacity:0.92; top:-2px; transform:rotate(-2deg);}
  .cinta-policial.abajo{top:auto; bottom:-2px; transform:rotate(1.5deg);}
  .silueta-tiza{display:block; width:min(220px,55%); opacity:0.8;}

  .lista-notas{list-style:none; padding:0; margin:0;}
  .lista-notas li{
    font-family:'Caveat', cursive; font-size:1.35rem; color:#3a3320; background:#efe6c8;
    border:1px solid rgba(33,29,18,0.13); padding:12px 16px; margin-bottom:9px; border-radius:var(--r-btn);
    box-shadow:0 1px 2px rgba(33,29,18,0.06); transform:rotate(-0.5deg);
  }
  .lista-notas li:nth-child(even){transform:rotate(0.5deg);}

  .lista-diario{list-style:none; padding:0; margin:0;}
  .lista-diario li{margin-bottom:14px; padding-left:12px; border-left:3px solid rgba(124,32,32,0.4);}
  .lista-diario .fecha{display:block; font-family:'IBM Plex Mono'; font-size:0.68rem; color:#8a836a; margin-bottom:3px; letter-spacing:0.5px;}
  .lista-diario p{font-style:italic;}

  .bitacora-linea{font-family:'IBM Plex Mono'; font-size:0.82rem; padding:5px 0; border-bottom:1px dashed rgba(33,29,18,0.15);}
  .bitacora-linea b{color:var(--blood);}

  /* caligrafía */
  .caligrafia-muestra{
    background:#efe6c8; border:1px solid rgba(33,29,18,0.15); padding:14px 16px; border-radius:var(--r-card); margin-bottom:10px;
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .caligrafia-muestra .firma{font-size:1.4rem; flex:1; min-width:200px;}
  .f-marta{font-family:'Reenie Beanie', cursive;}
  .f-carla{font-family:'Homemade Apple', cursive;}
  .f-ricardo{font-family:'Shadows Into Light', cursive;}
  .f-diego{font-family:'Nanum Pen Script', cursive;}
  .f-sofia{font-family:'Caveat', cursive;}
  .f-ivan{font-family:'IBM Plex Mono'; letter-spacing:0.5px; font-size:0.95rem !important;}
  .caligrafia-boton{flex:0 0 auto; white-space:nowrap;}

  /* sospechosos */
  .grid-sospechosos{display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px;}
  .mugshot-card{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; cursor:pointer; transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease; color:var(--text);}
  .mugshot-card:hover{transform:translateY(-3px); border-color:var(--amber); box-shadow:0 12px 26px rgba(0,0,0,0.4);}
  .mugshot-plate{aspect-ratio:4/5; position:relative; background:repeating-linear-gradient(to top, rgba(255,255,255,0.04) 0 1px, transparent 1px 22px), var(--ink); display:flex; align-items:center; justify-content:center; border-bottom:3px solid var(--amber);}
  .mugshot-silueta{width:52%; opacity:0.5; color:#4a4a36;}
  .mugshot-num{position:absolute; top:9px; left:10px; font-size:0.6rem; color:var(--text-dim); letter-spacing:1px;}
  .mugshot-info{padding:12px 14px 14px;}
  .mugshot-info h4{font-size:1.02rem; color:var(--paper); letter-spacing:0.3px; line-height:1.2;}
  .mugshot-info span{font-size:0.72rem; color:var(--text-dim); display:block; margin-top:3px;}
  .badge-estado{display:inline-block; margin-top:9px; font-size:0.6rem; letter-spacing:0.6px; text-transform:uppercase; padding:3px 9px; border-radius:var(--r-pill);}
  .badge-estado--sospecha{background:rgba(201,138,44,0.18); color:var(--amber); border:1px solid var(--amber);}
  .badge-estado--roto{background:rgba(124,32,32,0.22); color:var(--blood-bright); border:1px solid var(--blood-bright);}
  .badge-estado--parcial{background:rgba(201,138,44,0.14); color:var(--amber); border:1px solid var(--amber);}

  .modal-fondo{position:fixed; inset:0; background:rgba(4,4,2,0.82); display:flex; align-items:flex-start; justify-content:center; padding:24px 12px; overflow-y:auto; z-index:60;}
  .modal{background:#f1e9cc; color:var(--paper-ink); max-width:660px; width:100%; border-radius:var(--r-card); padding:28px 28px 26px; margin-top:24px; box-shadow:var(--shadow-modal);}
  .modal-cerrar{float:right; background:rgba(33,29,18,0.06); border:none; width:30px; height:30px; border-radius:50%; font-size:1.1rem; color:var(--paper-ink-soft); line-height:1;}
  .modal-cerrar:hover{background:rgba(33,29,18,0.14);}
  .modal h3{font-size:1.5rem; color:var(--blood); margin-bottom:4px;}
  .testimonio{background:#e9dfbd; border-left:4px solid var(--paper-ink); padding:14px 16px; border-radius:0 var(--r-btn) var(--r-btn) 0; font-family:'Special Elite'; font-style:italic; font-size:0.88rem; margin:14px 0;}
  .evidencia-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:8px; margin:12px 0;}
  .evidencia-btn{background:#e2d6ab; border:1px solid rgba(33,29,18,0.22); padding:10px 12px; font-family:'IBM Plex Mono'; font-size:0.72rem; font-weight:600; text-align:left; color:var(--paper-ink); box-shadow:0 1px 2px rgba(33,29,18,0.06);}
  .evidencia-btn:hover{border-color:var(--blood); transform:translateY(-1px);}
  .respuesta-suspecto{margin-top:14px; padding:14px 16px; border-radius:0 var(--r-btn) var(--r-btn) 0; font-family:'Special Elite'; font-style:italic; font-size:0.88rem;}
  .respuesta-suspecto.negativa{background:rgba(124,32,32,0.1); border-left:4px solid var(--blood);}
  .respuesta-suspecto.positiva{background:rgba(76,122,76,0.12); border-left:4px solid var(--ok);}
  .sin-conexion{background:rgba(33,29,18,0.05); border:1px dashed rgba(33,29,18,0.28); padding:14px 16px; border-radius:var(--r-btn); font-size:0.85rem;}
  .fila-modal{display:flex; gap:10px; flex-wrap:wrap; margin-top:18px;}

  .grid-pruebas{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px;}
  .prueba-card{background:#e9dfbd; border:1px solid rgba(33,29,18,0.18); border-radius:var(--r-btn); padding:13px 14px; box-shadow:0 1px 2px rgba(33,29,18,0.06);}
  .prueba-card b{font-size:0.85rem;}
  .prueba-card span{display:block; font-size:0.68rem; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:0.5px;}

  .corcho-intro{font-family:'Special Elite'; font-size:0.85rem; margin-bottom:12px;}
  .corcho{position:relative; background:#6b4a28; border:10px solid #4a3119; border-radius:var(--r-card); min-height:560px; background-image:repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 5px); box-shadow:inset 0 0 40px rgba(0,0,0,0.35); overflow:hidden;}
  .pin{position:absolute; width:clamp(60px,16vw,88px); transform:translate(-50%,-50%); text-align:center; cursor:pointer; font-family:'IBM Plex Mono'; font-size:0.58rem; color:#2b2210; z-index:2; transition:transform .15s ease;}
  .pin:hover{transform:translate(-50%,-50%) translateY(-2px);}
  .pin:hover, .pin.seleccionado{ z-index:5; }

const SALA_KEY = "muldrel_sala_v1";
const JUGADORES_KEY = "muldrel_jugadores_v1";

function idJugador(){
  let id = sessionStorage.getItem("muldrel_pid");
  if(!id){ id = "p_" + Math.random().toString(36).slice(2,9); sessionStorage.setItem("muldrel_pid", id); }
  return id;
}
function guardarSala(){
  const compartido = {
    hallazgosVistos: estado.hallazgosVistos,
    autopsiaVista: estado.autopsiaVista,
    confrontaciones: estado.confrontaciones,
    conexionesCorcho: estado.conexionesCorcho,
    caligrafiaElegida: estado.caligrafiaElegida,
    numJugadoresEsperados: estado.numJugadoresEsperados
  };
  localStorage.setItem(SALA_KEY, JSON.stringify(compartido));
}
function cargarSala(){
  const raw = localStorage.getItem(SALA_KEY);
  if(!raw) return;
  const d = JSON.parse(raw);
  Object.assign(estado, d);
}
function guardarResultadoJugador(resultado){
  const todos = JSON.parse(localStorage.getItem(JUGADORES_KEY) || "{}");
  todos[idJugador()] = resultado;
  localStorage.setItem(JUGADORES_KEY, JSON.stringify(todos));
}
function leerJugadores(){
  return JSON.parse(localStorage.getItem(JUGADORES_KEY) || "{}");
}
window.addEventListener("storage", (e)=>{
  if(e.key===SALA_KEY && document.getElementById("juego").classList.contains("activo") && !estado.acusacionBloqueada){
    cargarSala();
    renderRail();
    renderPanel();
  }
  if(e.key===JUGADORES_KEY && estado.acusacionBloqueada){

let intervaloReloj = null;
function iniciarJuego(){
  audioMenu.pause();
  if(!sonidoSilenciado){ audioJuego.currentTime = 0; audioJuego.volume = 0.5; audioJuego.play().catch(()=>{}); }
  document.getElementById("lobby").classList.remove("activo");
  document.getElementById("juego").classList.add("activo");
  window.scrollTo(0,0);
  cargarSala();
  guardarSala();
  estado.inicioTiempo = Date.now();
  intervaloReloj = setInterval(actualizarReloj, 1000);
  renderRail();
  renderPanel();
}
function escribirMaquina(el, texto, velocidad){
  if(!el) return;
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent = texto; return; }
  el.textContent = "";
  let i = 0;
  const t = setInterval(()=>{
    el.textContent += texto[i];
    i++;
    if(i>=texto.length) clearInterval(t);
  }, velocidad||12);
}
function actualizarReloj(){
  if(!estado.inicioTiempo || estado.acusacionBloqueada) return;
  const s = Math.floor((Date.now()-estado.inicioTiempo)/1000);
  pintarReloj(s);
}
function pintarReloj(s){
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  const el = document.getElementById("reloj");
  if(el) el.textContent = mm+":"+ss;
}
function formatoTiempo(s){
  const mm = String(Math.floor(s/60)).padStart(2,"0");
  const ss = String(s%60).padStart(2,"0");
  return mm+":"+ss;
}

  const conf = estado.confrontaciones[s.id] || {};
  const resuelto = conf.rota || conf.aclarada;
  const conectadas = evidenciasConectadas(s.id);

  let existente = document.getElementById("modal-fondo");
  if(existente) existente.remove();

  const div = document.createElement("div");
  div.id = "modal-fondo"; div.className = "modal-fondo";
  div.onclick = (e)=>{ if(e.target===div) cerrarSospechoso(); };

  let cuerpo;
  if(resuelto){
    cuerpo = `<div class="respuesta-suspecto ${conf.rota?'negativa':'positiva'}"><b>${conf.rota?'Confesión bajo presión':'Aclaración obtenida'}:</b> <span class="revelacion-texto">${s.revelacion}</span></div>`;
  } else {
    let usadas = [];
    if(s.pasos){ usadas = conf.parcial ? [s.pasos[0].evidencia] : []; }
    const disponibles = conectadas.filter(id => !usadas.includes(id));
    let parcialHtml = "";
    if(conf.parcial && s.pasos){ parcialHtml = `<div class="respuesta-suspecto positiva parcial-texto">${s.pasos[0].textoParcial}</div>`; }
    if(disponibles.length===0){
      cuerpo = `${parcialHtml}<p class="sin-conexion">Todavía no han relacionado ninguna prueba nueva con ${s.nombre.split(' ')[0]} en el corcho de conexiones. Vuelvan ahí, tiendan un hilo, y regresen a interrogar.</p>`;
    } else {
      cuerpo = `${parcialHtml}
        <p><b>Presenten una prueba conectada:</b></p>
        <div class="evidencia-grid" id="grid-evidencia">
          ${disponibles.map(id=>{const p=CASO.pruebas.find(x=>x.id===id); return `<button class="evidencia-btn" onclick="confrontar('${s.id}','${id}')">${p.nombre}</button>`;}).join("")}
        </div>
        <div id="respuesta-zona"></div>`;
    }
  }

  div.innerHTML = `
    <div class="modal">
      <button class="modal-cerrar" onclick="cerrarSospechoso()">✕</button>
      <h3>${s.nombre}, ${s.edad} años</h3>
      <p><b>${s.rol}</b></p>
      <p class="texto-suave" style="color:#6b654c">${s.relacion}</p>
      <div class="testimonio">${s.testimonio}</div>
      <p><b>Coartada declarada:</b> ${s.coartada}</p>
      ${cuerpo}
    </div>`;
  document.body.appendChild(div);
}

function confrontar(sospechosoId, pruebaId){
  const s = CASO.sospechosos.find(x=>x.id===sospechosoId);
  const actual = estado.confrontaciones[sospechosoId];
  if(actual?.rota || actual?.aclarada) return;

  if(s.pasos){
    const indice = actual?.parcial ? 1 : 0;
    const paso = s.pasos[indice];
    if(pruebaId !== paso.evidencia){
      mostrarDeflexion(s);
      return;
    }
    if(indice === s.pasos.length-1){
      estado.confrontaciones[sospechosoId] = {rota:true};
      renderRail(); renderModalSospechoso();
      escribirMaquina(document.querySelector(".revelacion-texto"), s.revelacion, 11);
    } else {
      estado.confrontaciones[sospechosoId] = {parcial:true};
      renderRail(); renderModalSospechoso();
      escribirMaquina(document.querySelector(".parcial-texto"), paso.textoParcial, 11);
    }
    return;
  }

  if(pruebaId === s.evidenciaClave){
    estado.confrontaciones[sospechosoId] = s.esCulpable ? {rota:true} : {aclarada:true};
    renderRail(); renderModalSospechoso();
    escribirMaquina(document.querySelector(".revelacion-texto"), s.revelacion, 11);
    return;
  }
  mostrarDeflexion(s);
}
function mostrarDeflexion(s){
  const zona = document.getElementById("respuesta-zona");
  if(zona) zona.innerHTML = `<div class="respuesta-suspecto negativa">${s.stonewall}</div>`;
}

/* ---------- corcho ---------- */
const PIN_POS = {
  ricardo:{x:10,y:12}, marta:{x:30,y:12}, diego:{x:50,y:12}, carla:{x:70,y:12}, ivan:{x:90,y:12},
  tela:{x:15,y:45}, copa:{x:35,y:45}, diario:{x:55,y:45}, bitacora_general:{x:75,y:45}, taxi:{x:93,y:45},
  sofia:{x:50,y:80}
};
const ALIAS_CORCHO = {
  tela:"Tela rasgada", copa:"Copa rota", diario:"Diario", bitacora_general:"Bitácora", taxi:"Recibo taxi"
};
function vistaCorcho(){
  const pinesHtml = Object.entries(PIN_POS).map(([id,pos])=>{
    const s = CASO.sospechosos.find(x=>x.id===id);
    const esTestigo = id==="sofia";
    const p = CASO.pruebas.find(x=>x.id===id);
    const nombre = s ? s.nombre.split(" ")[0]+" "+s.nombre.split(" ")[1][0]+"." : esTestigo ? "Sofía L." : ALIAS_CORCHO[id];
    const inicial = s ? s.nombre.split(" ").map(w=>w[0]).slice(0,2).join("") : esTestigo ? "SL" : p.nombre[0];
    const sel = estado.seleccionCorcho===id ? "seleccionado" : "";
    const claseFoto = (s||esTestigo) ? "" : "evidencia";
    return `<div class="pin ${sel}" style="left:${pos.x}%; top:${pos.y}%;" onclick="clicPin('${id}')">
      <div class="pin-foto ${claseFoto}">${inicial}</div>
      <span class="pin-etiqueta">${nombre}</span>
    </div>`;
  }).join("");
  return `
    <p class="corcho-intro">Corcho de conexiones — pulsen dos elementos para tender un hilo entre ellos. Vuelvan a pulsarlos para quitarlo. Conectar una prueba con una persona es lo que les permite confrontarla con ella en el interrogatorio.</p>
    <div class="corcho" id="corcho"><svg id="svg-cuerdas" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>${pinesHtml}</div>
    <p class="corcho-ayuda">Conexiones actuales: ${estado.conexionesCorcho.length}</p>`;
}
function clicPin(id){
  if(!estado.seleccionCorcho){ estado.seleccionCorcho=id; renderPanel(); return; }
  if(estado.seleccionCorcho===id){ estado.seleccionCorcho=null; renderPanel(); return; }
  const a=estado.seleccionCorcho, b=id;
  const idx = estado.conexionesCorcho.findIndex(c=>(c[0]===a&&c[1]===b)||(c[0]===b&&c[1]===a));
  if(idx>=0) estado.conexionesCorcho.splice(idx,1);
  else estado.conexionesCorcho.push([a,b]);
  estado.seleccionCorcho=null;
  renderPanel();
}
function dibujarCuerdas(){
  const svg = document.getElementById("svg-cuerdas");
  if(!svg) return;
  svg.innerHTML = estado.conexionesCorcho.map(([a,b])=>{
    const pa=PIN_POS[a], pb=PIN_POS[b];
    const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2 + 6;
    return `<path d="M ${pa.x} ${pa.y} Q ${mx} ${my} ${pb.x} ${pb.y}" stroke="#a53131" stroke-width="0.5" vector-effect="non-scaling-stroke" fill="none" opacity="0.85"/>`;
  }).join("");
}

/* ---------- cuaderno ---------- */
function vistaCuaderno(){
  return `
    <div class="doc">
      <div class="doc-etiqueta">Cuaderno del investigador</div>
      <h3>Su teoría del caso</h3>
      <p class="texto-suave" style="color:#6b654c">Antes de acusar a alguien, escriban en sus propias palabras qué creen que pasó: quién, con qué, y por qué. No se puntúa — pero la pestaña de acusación no se habilita hasta que hayan puesto algo de verdad en orden.</p>
      <textarea class="cuaderno-area" oninput="actualizarCuaderno(this.value)" placeholder="Ej: Creo que fue... porque...">${estado.cuaderno}</textarea>
      <p class="cuaderno-contador">${estado.cuaderno.length} / ${CASO.minCuaderno} caracteres mínimos</p>
    </div>`;
}
function actualizarCuaderno(v){ estado.cuaderno = v; const c = document.querySelector(".cuaderno-contador"); if(c) c.textContent = `${v.length} / ${CASO.minCuaderno} caracteres mínimos`; }

/* ---------- objetivos ---------- */
function vistaObjetivos(){
  return CASO.objetivos.map(o=>{
    const guardado = estado.respuestasObjetivos[o.id];
    return `<div class="doc">
      <div class="doc-etiqueta">${o.titulo}</div>
      <p><b>${o.pregunta}</b></p>
      ${o.opciones.map((op,i)=>{
        let cls="opcion";
        if(guardado!==undefined){
          if(i===o.correcta) cls+=" correcta";
          else if(i===guardado) cls+=" incorrecta";
        }
        return `<button class="${cls}" ${guardado!==undefined?'disabled':''} onclick="responderObjetivo('${o.id}',${i})">${op}</button>`;
      }).join("")}
      ${guardado===undefined ? `<p class="texto-suave" style="margin-top:6px;">Pista: ${o.pista}</p>` : ""}
    </div>`;
  }).join("");
}
function responderObjetivo(id,i){ estado.respuestasObjetivos[id]=i; renderPanel(); }

/* ---------- acusación ---------- */
function vistaAcusacion(){
  if(estado.cuaderno.length < CASO.minCuaderno){
    return `<div class="doc"><div class="doc-etiqueta">Cierre del expediente</div><h3>Todavía no</h3>
      <div class="aviso-bloqueo">Antes de acusar a alguien formalmente, completen su teoría del caso en la pestaña <b>Cuaderno</b> (al menos ${CASO.minCuaderno} caracteres). Un buen expediente no se cierra a la ligera.</div></div>`;
  }
  const ac = estado.acusacion;
  return `
    <div class="doc">
      <div class="doc-etiqueta">Cierre del expediente</div>
      <h3>Acusación formal</h3>
      <p>Elijan responsable, arma, motivo y al menos una prueba de respaldo.</p>
      <h4 style="margin:14px 0 6px;">¿Quién es el/la responsable?</h4>
      <div class="lista-elegible">
        ${CASO.sospechosos.map(s=>`<button class="elegible ${ac.sospechosoId===s.id?'marcado':''}" onclick="elegirAcusado('${s.id}')">${s.nombre}</button>`).join("")}
      </div>
      <h4 style="margin:14px 0 6px;">¿Con qué arma?</h4>
      <div class="lista-elegible">
        ${CASO.armasOpciones.map(id=>{
          const p = CASO.pruebas.find(x=>x.id===id);
          return `<button class="elegible ${ac.armaId===id?'marcado':''}" onclick="elegirArma('${id}')">${p.nombre}</button>`;
        }).join("")}
      </div>
      <h4 style="margin:14px 0 6px;">¿Cuál fue el motivo?</h4>
      <div class="lista-elegible">
        ${CASO.motivos.map(m=>`<button class="elegible ${ac.motivoId===m.id?'marcado':''}" onclick="elegirMotivo('${m.id}')">${m.texto}</button>`).join("")}
      </div>
      <h4 style="margin:14px 0 6px;">Pruebas de respaldo (elijan al menos una)</h4>
      <div class="lista-elegible">
        ${CASO.pruebas.map(p=>`<button class="elegible ${ac.pruebaIds.includes(p.id)?'marcado-multi':''}" onclick="toggleEvidenciaAcusacion('${p.id}')">${p.nombre}</button>`).join("")}
      </div>
      <button class="btn btn--sangre" style="margin-top:16px;" ${!(ac.sospechosoId&&ac.armaId&&ac.motivoId&&ac.pruebaIds.length) ? "disabled":""} onclick="confirmarAcusacion()">Presentar acusación formal</button>
      <p class="texto-suave" style="margin-top:10px;">Una vez presentada, no van a poder cambiarla — se les pedirá confirmar antes de cerrarla.</p>
    </div>`;
}
function elegirAcusado(id){ estado.acusacion.sospechosoId=id; renderPanel(); }
function elegirArma(id){ estado.acusacion.armaId=id; renderPanel(); }
function elegirMotivo(id){ estado.acusacion.motivoId=id; renderPanel(); }
function toggleEvidenciaAcusacion(id){
  const arr = estado.acusacion.pruebaIds;
  const i = arr.indexOf(id);
  if(i>=0) arr.splice(i,1); else arr.push(id);
  renderPanel();
}

function calcularResultado(){
  const ac = estado.acusacion;
  const detalle = [];
  let total = 0;

  const sospCorrecto = ac.sospechosoId === CASO.sospechosoCorrectoId;
  const confesionCulpable = estado.confrontaciones[CASO.sospechosoCorrectoId]?.rota;
  if(sospCorrecto && confesionCulpable){ total+=40; detalle.push({label:"Sospechosa correcta, con confesión completa", puntos:40, ok:true}); }
  else if(sospCorrecto){ total+=18; detalle.push({label:"Sospechosa correcta, pero sin confesión completa", puntos:18, ok:true}); }
  else { total-=15; const s=CASO.sospechosos.find(x=>x.id===ac.sospechosoId); detalle.push({label:`Acusaron a ${s.nombre}, inocente`, puntos:-15, ok:false}); }

  const armaCorrecta = ac.armaId === CASO.armaCorrectaId;
  if(armaCorrecta) total+=20;
  detalle.push({label:"Arma homicida", puntos:armaCorrecta?20:0, ok:armaCorrecta});

  const motivo = CASO.motivos.find(m=>m.id===ac.motivoId);
  const motivoOk = !!motivo?.correcto;
  if(motivoOk) total+=20;
  detalle.push({label:"Motivo", puntos:motivoOk?20:0, ok:motivoOk});

  const validas = ac.pruebaIds.filter(id=>CASO.pruebasClave.includes(id));
  const cuentan = Math.min(validas.length,2);
  total += cuentan*10;
  detalle.push({label:`${cuentan} prueba(s) de respaldo válidas`, puntos:cuentan*10, ok:cuentan>0});

  total = Math.max(0, Math.min(100,total));

  let veredicto;
  if(total>=90) veredicto="Caso resuelto con precisión ejemplar";
  else if(total>=70) veredicto="Caso resuelto correctamente";
  else if(total>=40) veredicto="Resolución parcial, con dudas razonables";
  else veredicto="El caso queda sin resolver de forma convincente";

  return {total, detalle, veredicto};
}

function confirmarAcusacion(){
  const ac = estado.acusacion;
  const s = CASO.sospechosos.find(x=>x.id===ac.sospechosoId);
  const arma = CASO.pruebas.find(x=>x.id===ac.armaId);
  const motivo = CASO.motivos.find(x=>x.id===ac.motivoId);

  let existente = document.getElementById("modal-fondo");
  if(existente) existente.remove();
  const div = document.createElement("div");
  div.id = "modal-fondo"; div.className = "modal-fondo";
  div.innerHTML = `
    <div class="modal">
      <h3>¿Cerrar el expediente con esta acusación?</h3>
      <p class="texto-suave">Revisen bien: después de confirmar, no van a poder volver a esta pestaña ni cambiar nada. El resultado no se conocerá hasta que ${estado.numJugadoresEsperados>1?'todas las personas de la ronda':'ustedes'} terminen.</p>
      <div class="testimonio" style="font-style:normal;">
        <b>Responsable:</b> ${s.nombre}<br>
        <b>Arma:</b> ${arma.nombre}<br>
        <b>Motivo:</b> ${motivo.texto}
      </div>
      <div class="fila-modal">
        <button class="btn btn--fantasma" onclick="document.getElementById('modal-fondo').remove()">Volver a revisar</button>
        <button class="btn btn--sangre" onclick="bloquearYEnviarAcusacion()">Sí, cerrar mi expediente</button>
      </div>
    </div>`;
  document.body.appendChild(div);
}

function bloquearYEnviarAcusacion(){
  const modal = document.getElementById("modal-fondo");
  if(modal) modal.remove();

  clearInterval(intervaloReloj);
  const segundos = estado.inicioTiempo ? Math.floor((Date.now()-estado.inicioTiempo)/1000) : 0;
  estado.tiempoFinalSeg = segundos;
  pintarReloj(segundos);

  const { total, detalle, veredicto } = calcularResultado();
  estado.acusacionBloqueada = true;

  guardarResultadoJugador({
    nombre: estado.nombreJugador || "Investigador/a sin nombre",
    puntaje: total,
    detalle, veredicto,
    tiempoSeg: segundos,
    acusacion: estado.acusacion,
    cuaderno: estado.cuaderno,
    terminadoEn: Date.now()
  });

  document.getElementById("rail").innerHTML = "";
  renderPanel();
}

function vistaEspera(){
  const jugadores = leerJugadores();
  const entradas = Object.entries(jugadores);
  const terminados = entradas.length;
  const esperados = estado.numJugadoresEsperados || 1;
  const listos = terminados >= esperados || estado.revelarForzado;

  if(!listos){
    return `
      <div class="doc" style="text-align:center;">
        <div class="estampa estampa--ambar">Expediente cerrado</div>
        <h3 style="margin-top:14px;">Esperando a que el resto termine su acusación</h3>
        <p class="texto-suave">${terminados} de ${esperados} han presentado su acusación. El ranking se revela cuando todas hayan terminado.</p>
        <div class="lista-elegible" style="margin-top:16px;">
          ${entradas.map(([id,j])=>`<div class="elegible marcado" style="cursor:default;">✓ ${j.nombre}</div>`).join("") || '<p class="texto-suave">Todavía nadie más ha terminado.</p>'}
        </div>
        <button class="btn btn--fantasma" style="margin-top:18px;" onclick="forzarRevelado()">Revelar de todas formas (sin esperar más)</button>
      </div>`;
  }
  return vistaRanking(jugadores);
}
function forzarRevelado(){ estado.revelarForzado = true; renderPanel(); }

function vistaRanking(jugadores){
  const miId = idJugador();
  const culpable = CASO.sospechosos.find(s=>s.id===CASO.sospechosoCorrectoId);
  const filas = Object.entries(jugadores)
    .map(([id,j])=>({id, ...j}))
    .sort((a,b)=> b.puntaje - a.puntaje || a.tiempoSeg - b.tiempoSeg);

  return `
    <div class="stack">
      <div class="veredicto-panel">
        <div class="estampa">Ranking final</div>
        <h3 style="margin-top:14px;">Así quedó el expediente</h3>
        <p class="texto-suave">Ordenado por puntaje; en caso de empate, gana quien acusó más rápido.</p>
      </div>
      <div class="doc">
        ${filas.map((f,i)=>`
          <div class="detalle-fila ${f.id===miId?'ok':''}" style="align-items:center;">
            <span><b>#${i+1}</b> ${f.nombre}${f.id===miId?' (ustedes)':''}</span>
            <span>${f.puntaje} pts · ${formatoTiempo(f.tiempoSeg)}</span>
          </div>`).join("")}
      </div>
      <div class="doc">
        <div class="doc-etiqueta">Resolución real</div>
        <h3>El expediente cierra con...</h3>
        <p><b>${culpable.nombre}</b> es la autora del homicidio de Elena Vasco Reyes.</p>
        <p>${culpable.revelacion}</p>
      </div>
      <div style="text-align:center;">
        <button class="btn" onclick="location.reload()">Reiniciar investigación</button>
      </div>
    </div>`;
}
</script>
